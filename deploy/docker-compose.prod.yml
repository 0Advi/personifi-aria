version: "3.8"

# Production deployment with Caddy for HTTPS
# Usage: DOMAIN=your-domain.com docker-compose -f deploy/docker-compose.prod.yml up -d

services:
  aria:
    build: ..
    container_name: aria-travel-guide
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      # Core services
      - GROQ_API_KEY=${GROQ_API_KEY}
      - DATABASE_URL=${DATABASE_URL}
      - GOOGLE_PLACES_API_KEY=${GOOGLE_PLACES_API_KEY}
      # Embeddings
      - JINA_API_KEY=${JINA_API_KEY}
      - HF_API_KEY=${HF_API_KEY}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-jina-embeddings-v3}
      - HF_EMBEDDING_MODEL=${HF_EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      - EMBEDDING_DIMS=${EMBEDDING_DIMS:-768}
      # Channels
      - TELEGRAM_ENABLED=${TELEGRAM_ENABLED:-true}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - WHATSAPP_ENABLED=${WHATSAPP_ENABLED:-false}
      - WHATSAPP_API_TOKEN=${WHATSAPP_API_TOKEN}
      - WHATSAPP_PHONE_ID=${WHATSAPP_PHONE_ID}
      - WHATSAPP_VERIFY_TOKEN=${WHATSAPP_VERIFY_TOKEN:-aria_webhook_verify}
      - SLACK_ENABLED=${SLACK_ENABLED:-false}
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN}
      - SLACK_SIGNING_SECRET=${SLACK_SIGNING_SECRET}
      # Feature toggles
      - PROACTIVE_NUDGES_ENABLED=${PROACTIVE_NUDGES_ENABLED:-true}
      - DAILY_TIPS_ENABLED=${DAILY_TIPS_ENABLED:-true}
      - BROWSER_SCRAPING_ENABLED=${BROWSER_SCRAPING_ENABLED:-true}
      # Fusion architecture (Phase 1)
      - FUSION_ENGINE_ENABLED=${FUSION_ENGINE_ENABLED:-false}
      - SOUL_V2_ENABLED=${SOUL_V2_ENABLED:-false}
      # Phase 2B concurrency
      - MAX_CONCURRENT_USERS=${MAX_CONCURRENT_USERS:-50}
      - MAX_QUEUE_DEPTH_PER_USER=${MAX_QUEUE_DEPTH_PER_USER:-5}
      - DB_POOL_MAX=${DB_POOL_MAX:-20}
      # Phase 2B provider migration
      - TOGETHER_API_KEY=${TOGETHER_API_KEY}
      - TOGETHER_MODEL=${TOGETHER_MODEL:-meta-llama/Llama-3.3-70B-Instruct-Turbo}
      - FIREWORKS_API_KEY=${FIREWORKS_API_KEY}
      - FIREWORKS_MODEL=${FIREWORKS_MODEL:-accounts/fireworks/models/llama-v3p3-70b-instruct}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN}
      - AWS_ENABLED=${AWS_ENABLED:-false}
      - AWS_BEDROCK_REGION=${AWS_BEDROCK_REGION:-ap-south-1}
      - AWS_BEDROCK_MODEL_ID=${AWS_BEDROCK_MODEL_ID:-anthropic.claude-3-haiku-20240307-v1:0}
      # Identity
      - LINK_CODE_EXPIRY_MINUTES=${LINK_CODE_EXPIRY_MINUTES:-10}
    shm_size: 1gb
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost:3000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

  caddy:
    image: caddy:2-alpine
    container_name: aria-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:?DOMAIN environment variable is required}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - aria

volumes:
  caddy_data:
  caddy_config:
